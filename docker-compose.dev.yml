version: '3.8'

services:
  telegram-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-downloader:dev

    # Development environment overrides
    environment:
      - TDL_DAEMON_ENABLED=false  # Disable daemon for manual testing
      - TDL_LOG_LEVEL=DEBUG

    # Mount source code for live editing
    volumes:
      - ./src:/app/src:ro
      - ./config.toml:/app/config.toml:ro
      - ./downloads:/downloads
      - ./sessions:/.sessions

    # No resource limits in dev
    deploy:
      resources: {}

    # More verbose logging in dev
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
