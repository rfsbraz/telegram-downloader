# Personal Backup
#
# Backs up saved messages and private chat media.

version: '3.8'

services:
  telegram-downloader:
    image: yourusername/telegram-downloader:latest
    container_name: telegram-personal-backup
    restart: unless-stopped

    environment:
      - TDL_API_ID=YOUR_API_ID
      - TDL_API_HASH=YOUR_API_HASH
      - TDL_PHONE_NUMBER=YOUR_PHONE_NUMBER

      - TDL_DAEMON_ENABLED=true
      - TDL_DAEMON_CHECK_INTERVAL=3600  # Check every hour

      # Source 1: Saved messages (use "me" as chat ID)
      - TDL_SOURCES_0_URL=https://t.me/me
      - TDL_SOURCES_0_NAME=Saved Messages

      # Source 2: Private chat (replace username)
      - TDL_SOURCES_1_URL=https://t.me/friend_username
      - TDL_SOURCES_1_NAME=Friend Chat

    volumes:
      - ./backup:/downloads
      - ./sessions:/.sessions
