name: Docker Build and Push

# develop pushes build edge (develop is the default branch) and sha tags.
# A push to main is the release sync from release.yml, and it builds latest and the version tags.
# Nothing else should reach main, so a push there that is not a release fails the run.
on:
  push:
    branches: [develop, main]
  schedule:
    - cron: '0 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/telegram-downloader

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # find-release.sh needs the history and tags.
          fetch-depth: 0

      - name: Find the release this push to main brings
        id: rel
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          TAG_GLOB: 'v*'
        run: bash scripts/find-release.sh

      - name: Stop on a push to main that is not a release
        if: ${{ github.ref == 'refs/heads/main' && steps.rel.outputs.release != 'true' }}
        run: |
          echo "This push to main is not a release sync from develop, so nothing is published."
          exit 1

      - name: Read Python version
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
          tags: |
            # Edge tag for the default branch, develop (unstable, for testers)
            type=raw,value=edge,enable={{is_default_branch}}
            # Commit SHA for traceability
            type=sha,prefix=sha-,format=short
            # Version tags only from the release sync on main (v1.2.3 -> latest, 1.2.3, 1.2, 1)
            type=raw,value=latest,enable=${{ steps.rel.outputs.release == 'true' }}
            type=semver,pattern={{version}},value=${{ steps.rel.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.rel.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.rel.outputs.tag }},enable=${{ !startsWith(steps.rel.outputs.tag, 'v0.') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=${{ steps.python.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ github.sha }}

      - name: Image digest
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
