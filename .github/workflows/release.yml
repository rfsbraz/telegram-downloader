name: Release

# Feature and fix PRs land on develop. release-please keeps its release PR open into develop;
# merging that PR tags the release on develop and publishes the GitHub release. sync-to-main then
# brings the tagged commit into main, where the Docker release tags are built (docker.yml).
on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Output release info
        if: ${{ steps.release.outputs.release_created }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          {
            echo "## Release created"
            echo ""
            echo "**Version:** $VERSION"
            echo "**Tag:** $TAG"
            echo ""
            echo "The sync-to-main job brings it into main, which builds the Docker release tags."
          } >> "$GITHUB_STEP_SUMMARY"

  sync-to-main:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: sync-to-main
      cancel-in-progress: false
    steps:
      - name: Open the develop to main sync PR and merge it once checks pass
        env:
          # A merge pushed with GITHUB_TOKEN starts no workflow on main, so no Docker release build.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "RELEASE_PLEASE_TOKEN is not set"; exit 1; fi
          # The tagged release commit, not the develop head, so later develop merges stay out.
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          branch="sync/develop-to-main-$TAG"
          if ! gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" > /dev/null 2>&1; then
            at=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq .object.sha)
            if [ "$at" != "$sha" ]; then echo "$branch exists at $at, not $sha"; exit 1; fi
          fi
          url=$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create --base main --head "$branch" \
              --title "chore(release): sync $TAG to main" \
              --body "Brings release $TAG from develop into main. It merges with a merge commit once checks pass. Never squash it.")
          fi
          # Checks register a few seconds after the PR opens.
          for _ in 1 2 3 4 5 6; do
            gh pr checks "$url" 2>&1 | grep -q "no checks reported" || break
            sleep 20
          done
          gh pr checks "$url" --watch --fail-fast
          gh pr merge "$url" --merge --match-head-commit "$sha"
