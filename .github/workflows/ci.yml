name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            PR title must start with lowercase letter after the type prefix.
            Example: "feat: add user authentication" or "fix(api): handle timeout"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit and integration tests
        run: |
          pytest tests/unit tests/integration -v --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Validate example configurations
        run: |
          for file in examples/*.yml; do
            echo "Validating $file"
            docker compose -f "$file" config > /dev/null
          done

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: telegram-downloader:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test (verify core modules import)
        run: |
          docker run --rm telegram-downloader:test python -c "
          import asyncio; asyncio.set_event_loop(asyncio.new_event_loop())
          from src.config import load_config, ConfigError
          from src.config.schema import Config, SourceConfig
          from src.state.cursor import CursorStore
          from src.filters import ExtensionFilter, SizeFilter, CompositeFilter
          from src.security.sanitizer import sanitize_filename, validate_path_safety
          print('All core modules import successfully')
          "

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
