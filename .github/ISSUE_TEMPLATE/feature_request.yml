name: Feature Request
description: Suggest an idea to improve Telegram Media Downloader.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! Please review [CONTRIBUTING.md](../../CONTRIBUTING.md) before submitting large proposals.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Provide a short headline for your feature idea.
      placeholder: Add support for S3 storage backend
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Who benefits from it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how the feature should work. Include configuration examples or mockups if helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: List any workarounds or alternative approaches you evaluated.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, dependencies, or references.
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: Willing to Contribute?
      options:
        - label: I can help implement this feature.
