version: '3.8'

services:
  telegram-downloader:
    image: yourusername/telegram-downloader:latest  # Will be updated in docs
    container_name: telegram-downloader
    restart: unless-stopped

    # Environment variables override config.toml
    environment:
      # Required: Telegram API credentials
      - TDL_API_ID=${TDL_API_ID:?API_ID is required}
      - TDL_API_HASH=${TDL_API_HASH:?API_HASH is required}
      - TDL_PHONE_NUMBER=${TDL_PHONE_NUMBER:?PHONE_NUMBER is required}

      # Daemon configuration
      - TDL_DAEMON_ENABLED=true
      - TDL_DAEMON_CHECK_INTERVAL=${TDL_CHECK_INTERVAL:-300}
      - TDL_DAEMON_HEALTH_FILE=/app/health_status.txt

      # Notification configuration (optional)
      - TDL_NOTIFICATIONS_ENABLED=${TDL_NOTIFICATIONS_ENABLED:-false}
      - TDL_NOTIFICATIONS_DETAIL_LEVEL=${TDL_DETAIL_LEVEL:-summary}
      - TDL_NOTIFICATIONS_DISCORD_WEBHOOK_URL=${TDL_DISCORD_WEBHOOK:-}
      - TDL_NOTIFICATIONS_GENERIC_WEBHOOK_URL=${TDL_GENERIC_WEBHOOK:-}

    # Volume mounts
    volumes:
      # Configuration file (optional, ENV vars take precedence)
      - ./config.toml:/app/config.toml:ro
      # Downloaded files (persistent)
      - ./downloads:/downloads
      # Session files (persistent, for authentication)
      - ./sessions:/.sessions

    # Health check (inherited from Dockerfile, override if needed)
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 2m
      timeout: 10s
      start_period: 1m
      retries: 3

    # Resource limits (recommended for production)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
