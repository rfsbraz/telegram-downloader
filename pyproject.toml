[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-downloader"
version = "0.1.0"
description = "Automated Telegram media downloader with multi-source support and flexible filtering."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Telegram Downloader Contributors" }
]
keywords = ["telegram", "downloader", "automation", "media"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Communications :: File Sharing",
  "Topic :: Internet :: WWW/HTTP"
]
dependencies = [
  "pyrogram>=2.0.106",
  "pyyaml>=6.0.3",
  "pydantic>=2.0.0",
  "requests>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/rfsbraz/telegram-downloader"
Documentation = "https://rfsbraz.github.io/telegram-downloader/"
Issues = "https://github.com/rfsbraz/telegram-downloader/issues"

[tool.setuptools.packages.find]
where = ["src"]