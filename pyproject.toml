[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-downloader"
version = "1.0.0"
description = "Automated media downloader for Telegram channels and groups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyrogram>=2.0.106",
    "tgcrypto>=1.2.5",
    "pyyaml>=6.0.3",
    "pydantic>=2.12.5",
    "requests>=2.33.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "smoke: Smoke tests",
    "docker: Docker tests",
]
addopts = [
    "-v",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/main.py",
    "src/__init__.py",
    "*/__init__.py",
    # Modules requiring Telegram API mocking (future test expansion)
    "src/daemon/service.py",
    "src/client/*",
    "src/sources/*",
    "src/notifications/*",
    "src/organization/*",
    "src/config/source_parser.py",
    "src/config/url_parser.py",
    "src/daemon/health.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
